[project]
name = "arkatara-backend"
version = "0.1.0"
description = "ARKA TARA modular-monolith API"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
  "Django==5.2.17",
  "django-cors-headers>=4.9,<5",
  "djangorestframework==3.18.1",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "pytest-django==4.14.0",
  "ruff>=0.13,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra --strict-markers -p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["DJ008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
